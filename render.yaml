services:
  - type: web
    name: sannygold-operacao
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: ROTAFLOW_STORAGE_DIR
        value: /tmp/rotaflow
